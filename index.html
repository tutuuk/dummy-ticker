<!DOCTYPE html>
<html>
<head>
  <title>NSE Nifty 50 Ticker</title>
  <style>
    body { 
      margin:0; 
      background:black; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .ticker {
      background: black;
      font-family: "Segoe UI", Roboto, Verdana, Arial, sans-serif; /* unified font stack */
      font-size: 26px;
      font-weight: 500;   /* consistent medium weight */
      letter-spacing: 0px;
      overflow: hidden;
      white-space: nowrap;
      padding: 6px 0;
    }

    .ticker span {
      font-family: inherit;   /* force same font for all spans */
      font-weight: inherit;   /* inherit weight */
      padding: 0 6px;         /* tighter spacing */
      text-shadow: 0 0 1px rgba(255,255,255,0.25);
    }

    .ticker-content {
      display: inline-block;
      animation: scroll 120s linear infinite;
    }

    /* Pause on hover */
    .ticker:hover .ticker-content {
      animation-play-state: paused;
    }

    @keyframes scroll {
      from { transform: translateX(0%); }
      to { transform: translateX(-100%); } /* seamless loop with duplicate content */
    }

    .up   { color: lime; }
    .down { color: red; }
    .flat { color: #ccc; }

    /* Responsive adjustments */
    @media (max-width: 760px) {
      .ticker { font-size: 3.5vw; }
      .ticker span { padding: 0 1.5vw; }
    }
    @media (max-width: 480px) {
      .ticker { font-size: 4.5vw; }
      .ticker span { padding: 0 1vw; }
    }
  </style>
</head>
